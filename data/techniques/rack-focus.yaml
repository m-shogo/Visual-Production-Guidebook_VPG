one_liner: 手前と奥、どちらにピントを合わせるかを画面内で切り替える
impression_tags:
  - 気付き
  - 視点誘導
  - 意外性
fits_when: 2つの被写体の関係性や優先順位を観客に順番で理解させたいとき
avoid_when: 画面内の被写体が1つしかなく、切り替える対象が存在しない場合
why_it_works: >
  人間の目はピントの合った領域に自然と注意を向ける。ピント送りは「今どこを
  見るべきか」を編集者が能動的にコントロールできる数少ない撮影内演出であり、
  カットを割らずに視点誘導と情報の後出しができる。
